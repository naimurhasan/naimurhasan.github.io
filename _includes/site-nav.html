<header class="topbar">
  <div class="in">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% include logo.html %}
      <span class="name">Naimur Hasan{% if page.layout == 'blog' or page.layout == 'post' %} <span class="sub">/ blog</span>{% endif %}</span>
    </a>
    <div class="right">
    <nav class="navlinks" aria-label="Main">
      <a href="{{ '/blog/' | relative_url }}"{% if page.layout == 'blog' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/#work' | relative_url }}">Work</a>
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between day and night">
      <svg class="ico ico-day" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1"/></svg>
      <svg class="ico ico-night" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M13.4 10.3A5.8 5.8 0 0 1 5.7 2.6a5.8 5.8 0 1 0 7.7 7.7z"/></svg>
    </button>
    </div>
  </div>
</header>
