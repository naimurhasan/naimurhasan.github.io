<div class="tlab" id="tlsLab">
  <div class="tlab-head">
    <h4>Naimur's TLS Test for Dummies</h4>
    <p>Build a client, then see how a WAF would classify it. Drag a chip into a slot, or just tap it.</p>
  </div>

  <div class="tlab-presets" id="tlabPresets"></div>

  <div class="tlab-board">
    <div class="tlab-col" id="tlabPalette"></div>
    <div class="tlab-col tlab-col-packet" id="tlabSlots"></div>
  </div>

  <div class="tlab-verdict" id="tlabVerdict">
    <div class="tlab-verdict-top">
      <span class="tlab-tag" id="tlabTag">Waiting</span>
      <strong id="tlabTitle">Fill the slots to run the detection engine</strong>
    </div>
    <ul class="tlab-rules" id="tlabRules"></ul>
    <div class="tlab-ja4">
      <span>JA4 prefix</span>
      <code id="tlabJa4">—</code>
    </div>
  </div>
</div>

<style>
.tlab {
  --tlab-wire: 60, 90, 119;
  --tlab-off: 120, 113, 108;
  --tlab-app: 141, 110, 99;
  margin: 2.4rem 0;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--paper-sunk);
  overflow: hidden;
  font-size: 1rem;
}

.tlab-head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--rule);
}

.tlab-head h4 {
  margin: 0;
  font-family: var(--display);
  font-size: 1.3rem;
}

.tlab-head p {
  margin: 6px 0 0;
  font-size: 0.9375rem;
  line-height: 1.55;
  color: var(--ink-soft);
}

.tlab-presets {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--rule);
}

.tlab-presets button {
  font-family: var(--body);
  font-size: 0.875rem;
  padding: 7px 13px;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s ease;
}

.tlab-presets button:hover {
  border-color: var(--ink-faint);
  color: var(--ink);
}

.tlab-presets button.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.tlab-board {
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;
}

.tlab-col {
  padding: 18px 20px;
  display: grid;
  gap: 18px;
  align-content: start;
}

.tlab-col-packet {
  border-left: 1px solid var(--rule);
}

.tlab-layer-name {
  display: block;
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 2px;
}

.tlab-layer-note {
  display: block;
  font-size: 0.8125rem;
  color: var(--ink-faint);
  margin-bottom: 10px;
  line-height: 1.5;
}

.tlab-field {
  margin-bottom: 12px;
}

.tlab-field-label {
  display: block;
  font-size: 0.8125rem;
  color: var(--ink-soft);
  margin-bottom: 5px;
}

.tlab-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tlab-chip {
  font-family: var(--body);
  font-size: 0.875rem;
  padding: 6px 11px;
  border-radius: 6px;
  border: 1px solid rgba(var(--tlab-tone), 0.3);
  background: rgba(var(--tlab-tone), 0.06);
  color: var(--ink);
  cursor: grab;
  transition: all 0.15s ease;
}

.tlab-chip:hover {
  background: rgba(var(--tlab-tone), 0.14);
}

.tlab-chip.is-used {
  opacity: 0.4;
  cursor: default;
}

.tlab-slot {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 13px;
  margin-bottom: 8px;
  border: 1px solid rgba(var(--tlab-tone), 0.28);
  border-radius: 7px;
  background: rgba(var(--tlab-tone), 0.05);
  min-height: 50px;
  transition: all 0.15s ease;
}

.tlab-slot.is-empty {
  border-style: dashed;
  background: transparent;
}

.tlab-slot.is-over {
  border-style: solid;
  background: rgba(var(--tlab-tone), 0.16);
}

.tlab-slot.is-filled { cursor: pointer; }

.tlab-slot.is-conflict {
  border-color: rgba(176, 58, 46, 0.55);
  background: rgba(176, 58, 46, 0.07);
}

.tlab-slot-key {
  font-size: 0.8125rem;
  color: var(--ink-faint);
  width: 40%;
  flex-shrink: 0;
  line-height: 1.4;
}

.tlab-slot-value {
  font-size: 0.9375rem;
  color: var(--ink);
  line-height: 1.4;
}

.tlab-slot.is-empty .tlab-slot-value {
  color: var(--ink-faint);
}

.tlab-slot-mark {
  margin-left: auto;
  font-size: 0.875rem;
  color: var(--ink-faint);
  flex-shrink: 0;
}

.tlab-verdict {
  padding: 18px 20px;
  border-top: 1px solid var(--rule);
  background: var(--paper);
  border-left: 3px solid var(--rule);
}

.tlab-verdict.v-good { border-left-color: #4d7c5a; }
.tlab-verdict.v-warn { border-left-color: #a8762f; }
.tlab-verdict.v-bad  { border-left-color: #a8453a; }

.tlab-verdict-top {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px;
}

.tlab-verdict-top strong {
  font-family: var(--display);
  font-size: 1.15rem;
  line-height: 1.35;
}

.tlab-tag {
  font-size: 0.75rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 4px;
  border: 1px solid var(--rule);
  color: var(--ink-faint);
  flex-shrink: 0;
}

.v-good .tlab-tag { color: #4d7c5a; border-color: rgba(77, 124, 90, 0.4); }
.v-warn .tlab-tag { color: #a8762f; border-color: rgba(168, 118, 47, 0.4); }
.v-bad  .tlab-tag { color: #a8453a; border-color: rgba(168, 69, 58, 0.4); }

.tlab-rules {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: grid;
  gap: 8px;
}

.tlab-rules li {
  font-size: 0.9375rem;
  line-height: 1.6;
  color: var(--ink-soft);
  padding-left: 16px;
  position: relative;
}

.tlab-rules li::before {
  content: "—";
  position: absolute;
  left: 0;
  color: var(--ink-faint);
}

.tlab-rules strong { color: var(--ink); }

.tlab-ja4 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
  font-size: 0.8125rem;
  color: var(--ink-faint);
}

.tlab-ja4 code { font-size: 0.875rem; }

:root[data-theme="dark"] .tlab {
  --tlab-wire: 128, 160, 190;
  --tlab-off: 160, 152, 145;
  --tlab-app: 190, 158, 140;
}

:root[data-theme="dark"] .tlab-verdict.v-good { border-left-color: #7fbf9b; }
:root[data-theme="dark"] .tlab-verdict.v-warn { border-left-color: #d9a85c; }
:root[data-theme="dark"] .tlab-verdict.v-bad  { border-left-color: #e8706a; }

:root[data-theme="dark"] .v-good .tlab-tag { color: #7fbf9b; border-color: rgba(127, 191, 155, 0.4); }
:root[data-theme="dark"] .v-warn .tlab-tag { color: #d9a85c; border-color: rgba(217, 168, 92, 0.4); }
:root[data-theme="dark"] .v-bad  .tlab-tag { color: #e8706a; border-color: rgba(232, 112, 106, 0.4); }

:root[data-theme="dark"] .tlab-slot.is-conflict {
  border-color: rgba(232, 112, 106, 0.5);
  background: rgba(232, 112, 106, 0.08);
}

@media (max-width: 760px) {
  .tlab-board { grid-template-columns: 1fr; }
  .tlab-col-packet { border-left: 0; border-top: 1px solid var(--rule); }
  .tlab-slot-key { width: 45%; }
}
</style>

<script>
(function () {
  const ALL = ["chromium", "firefox", "tool"];

  const NAME = {
    chromium: "Chrome",
    firefox: "Firefox",
    tool: "an automation tool"
  };

  const LAYERS = [
    { id: "wire", tone: "var(--tlab-wire)", name: "On the wire", note: "These four fields are hashed into the fingerprint." },
    { id: "off", tone: "var(--tlab-off)", name: "Off the wire", note: "The server never sees your library, only the bytes it writes." },
    { id: "app", tone: "var(--tlab-app)", name: "One layer up", note: "The HTTP header arrives after the handshake is judged." }
  ];

  const CATEGORIES = [
    { key: "ciphers", layer: "wire", label: "Cipher suite list" },
    { key: "grease", layer: "wire", label: "GREASE entries" },
    { key: "alpn", layer: "wire", label: "ALPN protocols" },
    { key: "extorder", layer: "wire", label: "Extension order" },
    { key: "engine", layer: "off", label: "TLS library" },
    { key: "ua", layer: "app", label: "Claimed User-Agent" }
  ];

  const PARTS = {
    ciphers: [
      { id: "chromium", label: "Chromium (16)", families: ["chromium"], count: 16, tell: "Chromium's fixed 16-suite order." },
      { id: "nss", label: "Firefox (17)", families: ["firefox"], count: 17, tell: "NSS puts ChaCha20 ahead of AES." },
      { id: "openssl", label: "OpenSSL default (47)", families: ["tool"], count: 47, tell: "No browser has ever shipped OpenSSL's 47-suite default list." },
      { id: "minimal", label: "Minimal CLI (9)", families: ["tool"], count: 9, tell: "A trimmed build-time list, typical of CLI tools." }
    ],
    grease: [
      { id: "on", label: "GREASE on", families: ["chromium"], tell: "Random 0x?a?a values are a Chromium signature." },
      { id: "off", label: "GREASE off", families: ["firefox", "tool"], tell: "No GREASE, which is correct for Firefox and for every default HTTP library." }
    ],
    alpn: [
      { id: "h2", label: "h2, http/1.1", families: ["chromium", "firefox"], ja4: "h2", tell: "Asks for HTTP/2, as both browsers do." },
      { id: "h1", label: "http/1.1", families: ["tool"], ja4: "h1", tell: "HTTP/1.1 only: urllib3 and plain curl never ask for h2." },
      { id: "none", label: "No ALPN", families: ["tool"], ja4: "00", tell: "A missing ALPN extension is impossible for a browser." }
    ],
    extorder: [
      { id: "chromium", label: "Chromium (16)", families: ["chromium"], count: 16, tell: "Chromium's extension set is known even though it shuffles the order." },
      { id: "nss", label: "Firefox (14)", families: ["firefox"], count: 14, tell: "NSS sends server_name first in a stable sequence." },
      { id: "minimal", label: "Minimal (7)", families: ["tool"], count: 7, tell: "Seven extensions: the minimum needed to connect." }
    ],
    engine: [
      { id: "boringssl", label: "BoringSSL", families: ["chromium"] },
      { id: "nss", label: "NSS", families: ["firefox"] },
      { id: "openssl", label: "OpenSSL", families: ["tool"] },
      { id: "libressl", label: "LibreSSL", families: ["tool"] }
    ],
    ua: [
      { id: "chrome", label: "Chrome 122", families: ["chromium"] },
      { id: "firefox", label: "Firefox 124", families: ["firefox"] },
      { id: "python", label: "python-requests", families: ["tool"] },
      { id: "curl", label: "curl/8.4.0", families: ["tool"] }
    ]
  };

  const WIRE = ["ciphers", "grease", "alpn", "extorder"];

  const PRESETS = [
    { id: "python", label: "Python requests", sel: { ciphers: "openssl", grease: "off", alpn: "h1", extorder: "minimal", engine: "openssl", ua: "python" } },
    { id: "spoof", label: "requests + fake Chrome UA", sel: { ciphers: "openssl", grease: "off", alpn: "h1", extorder: "minimal", engine: "openssl", ua: "chrome" } },
    { id: "curl", label: "curl", sel: { ciphers: "minimal", grease: "off", alpn: "none", extorder: "minimal", engine: "libressl", ua: "curl" } },
    { id: "chrome", label: "Real Chrome", sel: { ciphers: "chromium", grease: "on", alpn: "h2", extorder: "chromium", engine: "boringssl", ua: "chrome" } },
    { id: "firefox", label: "Real Firefox", sel: { ciphers: "nss", grease: "off", alpn: "h2", extorder: "nss", engine: "nss", ua: "firefox" } },
    { id: "cffi", label: "curl_cffi", sel: { ciphers: "chromium", grease: "on", alpn: "h2", extorder: "chromium", engine: "openssl", ua: "chrome" } }
  ];

  const part = (cat, id) => PARTS[cat].find(p => p.id === id);
  const category = key => CATEGORIES.find(c => c.key === key);
  const intersect = (a, b) => a.filter(x => b.indexOf(x) > -1);
  const isComplete = sel => CATEGORIES.every(c => sel[c.key]);

  function wireFamily(sel) {
    const left = WIRE.reduce((acc, k) => intersect(acc, part(k, sel[k]).families), ALL.slice());
    return left.length === 1 ? left[0] : "unknown";
  }

  function conflicts(sel) {
    const anchor = part("ciphers", sel.ciphers).families[0];
    return WIRE.filter(k => k !== "ciphers" && part(k, sel[k]).families.indexOf(anchor) === -1);
  }

  function ja4Prefix(sel) {
    const pad = n => String(n).padStart(2, "0");
    return "t13d" + pad(part("ciphers", sel.ciphers).count) + pad(part("extorder", sel.extorder).count) + part("alpn", sel.alpn).ja4;
  }

  function evaluate(sel) {
    const fp = wireFamily(sel);
    const uaFam = part("ua", sel.ua).families[0];
    const patched = fp !== "unknown" && part("engine", sel.engine).families[0] !== fp;

    if (fp === "unknown") {
      const anchor = part("ciphers", sel.ciphers).families[0];
      const odd = conflicts(sel).map(k => "<strong>" + category(k).label + "</strong>").join(" and ");
      const verb = conflicts(sel).length > 1 ? " contradict it." : " contradicts it.";
      return {
        level: "bad", tag: "Blocked", title: "Unknown client",
        rules: [
          "Your cipher list belongs to <strong>" + NAME[anchor] + "</strong>, but " + odd + verb,
          conflicts(sel).map(k => part(k, sel[k]).tell).join(" "),
          "A hash matching no shipping client scores worse than a known bot: anomaly detection reads it as a hand-rolled stack."
        ]
      };
    }

    if (uaFam === fp && fp === "tool") {
      return {
        level: "warn", tag: "Identified", title: "Classified as a tool, honestly",
        rules: [
          "Handshake and header agree, so nothing here is a lie and impersonation scoring never fires.",
          "Expect rate limits or a challenge page rather than a hard 403.",
          "Scrapers get blocked for lying, not for being scripts."
        ]
      };
    }

    if (uaFam === fp) {
      const rules = [
        "All four wire fields point to <strong>" + NAME[fp] + "</strong>, and the header claims the same thing.",
        part("grease", sel.grease).tell
      ];
      if (patched) {
        rules.push("You picked <strong>" + part("engine", sel.engine).label + "</strong>, which does not write these bytes by default, so this is a patched stack like curl_cffi or uTLS. It still passes: the server hashes the bytes, not the library.");
        rules.push("The next layer catches it instead. Akamai hashes the HTTP/2 SETTINGS frame and header order; TLS alone is only half the disguise.");
        return { level: "good", tag: "Passes", title: "Accepted as " + NAME[fp] + ", by impersonation", rules: rules };
      }
      return { level: "good", tag: "Allowed", title: "Accepted as a genuine " + NAME[fp] + " session", rules: rules };
    }

    if (fp === "tool") {
      return {
        level: "bad", tag: "Blocked", title: "Impersonation detected",
        rules: [
          "The handshake fingerprints as <strong>" + NAME.tool + "</strong> while the header claims <strong>" + part("ua", sel.ua).label + "</strong>.",
          part("ciphers", sel.ciphers).tell + " " + part("grease", sel.grease).tell,
          "The ClientHello arrives before the header, so the contradiction is recorded before your User-Agent is even parsed."
        ]
      };
    }

    return {
      level: "bad", tag: "Blocked", title: "Clean handshake, confessing header",
      rules: [
        "Nothing on the wire gives you away: this is a convincing <strong>" + NAME[fp] + "</strong> fingerprint.",
        "Then the header says <strong>" + part("ua", sel.ua).label + "</strong> and drops the disguise.",
        "A User-Agent deny list is the cheapest rule in any WAF, and it fires here."
      ]
    };
  }

  const root = document.getElementById("tlsLab");
  if (!root) return;

  const paletteEl = document.getElementById("tlabPalette");
  const slotsEl = document.getElementById("tlabSlots");
  const presetsEl = document.getElementById("tlabPresets");
  const verdictEl = document.getElementById("tlabVerdict");
  const tagEl = document.getElementById("tlabTag");
  const titleEl = document.getElementById("tlabTitle");
  const rulesEl = document.getElementById("tlabRules");
  const ja4El = document.getElementById("tlabJa4");

  let selection = {};
  let activePreset = null;

  function layerBlock(layer, inner) {
    return '<div class="tlab-layer" style="--tlab-tone: ' + layer.tone + '">' +
      '<span class="tlab-layer-name">' + layer.name + "</span>" +
      '<span class="tlab-layer-note">' + layer.note + "</span>" +
      inner +
    "</div>";
  }

  function buildPalette() {
    paletteEl.innerHTML = LAYERS.map(layer => layerBlock(layer,
      CATEGORIES.filter(c => c.layer === layer.id).map(cat =>
        '<div class="tlab-field">' +
          '<span class="tlab-field-label">' + cat.label + "</span>" +
          '<div class="tlab-chips">' +
            PARTS[cat.key].map(p =>
              '<button class="tlab-chip" type="button" draggable="true" data-cat="' + cat.key + '" data-id="' + p.id + '">' + p.label + "</button>"
            ).join("") +
          "</div>" +
        "</div>"
      ).join("")
    )).join("");
  }

  function buildSlots() {
    slotsEl.innerHTML = LAYERS.map(layer => layerBlock(layer,
      CATEGORIES.filter(c => c.layer === layer.id).map(cat =>
        '<div class="tlab-slot is-empty" data-cat="' + cat.key + '">' +
          '<span class="tlab-slot-key">' + cat.label + "</span>" +
          '<span class="tlab-slot-value">drop here</span>' +
          '<span class="tlab-slot-mark"></span>' +
        "</div>"
      ).join("")
    )).join("");
  }

  function buildPresets() {
    presetsEl.innerHTML = PRESETS.map(p =>
      '<button type="button" data-preset="' + p.id + '">' + p.label + "</button>"
    ).join("");
  }

  function place(cat, id) {
    if (!PARTS[cat] || !part(cat, id)) return;
    selection[cat] = id;
    activePreset = null;
    render();
  }

  function render() {
    const complete = isComplete(selection);
    const unknown = complete && wireFamily(selection) === "unknown";
    const bad = unknown ? conflicts(selection) : [];

    slotsEl.querySelectorAll(".tlab-slot").forEach(slot => {
      const cat = slot.getAttribute("data-cat");
      const id = selection[cat];
      const conflicted = bad.indexOf(cat) > -1;
      slot.classList.toggle("is-empty", !id);
      slot.classList.toggle("is-filled", Boolean(id));
      slot.classList.toggle("is-conflict", conflicted);
      slot.querySelector(".tlab-slot-value").textContent = id ? part(cat, id).label : "drop here";
      slot.querySelector(".tlab-slot-mark").textContent = !id ? "" : conflicted ? "conflict" : "";
    });

    paletteEl.querySelectorAll(".tlab-chip").forEach(chip => {
      chip.classList.toggle("is-used", selection[chip.getAttribute("data-cat")] === chip.getAttribute("data-id"));
    });

    presetsEl.querySelectorAll("button").forEach(btn => {
      btn.classList.toggle("is-active", btn.getAttribute("data-preset") === activePreset);
    });

    if (!complete) {
      const left = CATEGORIES.filter(c => !selection[c.key]).length;
      verdictEl.className = "tlab-verdict";
      tagEl.textContent = "Waiting";
      titleEl.textContent = left + (left === 1 ? " slot left" : " slots left");
      rulesEl.innerHTML = "";
      ja4El.textContent = "—";
      return;
    }

    const result = evaluate(selection);
    verdictEl.className = "tlab-verdict v-" + result.level;
    tagEl.textContent = result.tag;
    titleEl.textContent = result.title;
    rulesEl.innerHTML = result.rules.map(r => "<li>" + r + "</li>").join("");
    ja4El.textContent = ja4Prefix(selection);
  }

  paletteEl.addEventListener("click", e => {
    const chip = e.target.closest(".tlab-chip");
    if (chip) place(chip.getAttribute("data-cat"), chip.getAttribute("data-id"));
  });

  paletteEl.addEventListener("dragstart", e => {
    const chip = e.target.closest(".tlab-chip");
    if (!chip) return;
    e.dataTransfer.setData("text/plain", chip.getAttribute("data-cat") + ":" + chip.getAttribute("data-id"));
    e.dataTransfer.effectAllowed = "copy";
  });

  slotsEl.addEventListener("dragover", e => {
    const slot = e.target.closest(".tlab-slot");
    if (!slot) return;
    e.preventDefault();
    slot.classList.add("is-over");
  });

  slotsEl.addEventListener("dragleave", e => {
    const slot = e.target.closest(".tlab-slot");
    if (slot) slot.classList.remove("is-over");
  });

  slotsEl.addEventListener("drop", e => {
    const slot = e.target.closest(".tlab-slot");
    if (!slot) return;
    e.preventDefault();
    slot.classList.remove("is-over");
    const payload = (e.dataTransfer.getData("text/plain") || "").split(":");
    if (payload[0] === slot.getAttribute("data-cat")) place(payload[0], payload[1]);
  });

  slotsEl.addEventListener("click", e => {
    const slot = e.target.closest(".tlab-slot.is-filled");
    if (!slot) return;
    delete selection[slot.getAttribute("data-cat")];
    activePreset = null;
    render();
  });

  presetsEl.addEventListener("click", e => {
    const btn = e.target.closest("[data-preset]");
    if (!btn) return;
    const preset = PRESETS.find(p => p.id === btn.getAttribute("data-preset"));
    selection = Object.assign({}, preset.sel);
    activePreset = preset.id;
    render();
  });

  buildPalette();
  buildPresets();
  buildSlots();
  render();
})();
</script>
